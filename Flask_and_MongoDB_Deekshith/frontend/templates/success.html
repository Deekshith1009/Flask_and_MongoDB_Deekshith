<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success</title>
    <style>
        :root { --bg: #f7f7f5; --card: #ffffff; --text: #1d2327; --line: #d5d9dc; --accent: #1f6f5c; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #15191b; --card: #1e2326; --text: #e8ecee; --line: #343c40; --accent: #4fb39b; }
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); color: var(--text); font-family: Georgia, "Times New Roman", serif; }
        .card { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 32px; text-align: center; }
        h1 { margin: 0 0 20px; font-size: 1.6rem; color: var(--accent); }
        a { color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Data submitted successfully</h1>
        <a href="/">Submit another response</a>
    </main>
</body>
</html>
